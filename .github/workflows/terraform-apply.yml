name: Terraform Apply

on:
  push:
    branches:
      - main
    paths:
      - 'terraform/**'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID || '259851212818' }}
  GHA_ROLE_NAME: ${{ vars.GHA_ROLE_NAME || 'github-actions-terraform' }}

jobs:
  apply:
    name: Terraform Apply
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ env.AWS_ACCOUNT_ID }}:role/${{ env.GHA_ROLE_NAME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.15.0"

      - name: Cache Terraform providers
        uses: actions/cache@v4
        with:
          path: terraform/.terraform
          key: terraform-${{ hashFiles('terraform/.terraform.lock.hcl') }}

      - name: Terraform Init
        working-directory: terraform
        run: terraform init -reconfigure

      - name: Import pre-existing Kubernetes resources
        working-directory: terraform
        continue-on-error: true
        run: |
          terraform import kubernetes_namespace.dev dev

      - name: Terraform Force Unlock (stale lock cleanup)
        working-directory: terraform
        continue-on-error: true
        run: |
          echo "Checking for stale state locks..."
          LOCK_INFO=$(terraform force-unlock 7fcf9dfe-2a23-97be-2675-96b3b3c2b329 2>&1 || true)
          echo "$LOCK_INFO"
          if echo "$LOCK_INFO" | grep -q "Lock Released"; then
            echo "Successfully released stale lock"
          else
            echo "No active lock found or lock already released"
          fi

      - name: Terraform Apply
        working-directory: terraform
        run: terraform apply -auto-approve
