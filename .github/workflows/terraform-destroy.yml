name: Terraform Destroy

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID || '259851212818' }}
  GHA_ROLE_NAME: ${{ vars.GHA_ROLE_NAME || 'github-actions-terraform' }}

jobs:
  destroy:
    name: Terraform Destroy
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ env.AWS_ACCOUNT_ID }}:role/${{ env.GHA_ROLE_NAME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.15.0"

      - name: Cache Terraform providers
        uses: actions/cache@v4
        with:
          path: terraform/.terraform
          key: terraform-${{ hashFiles('terraform/.terraform.lock.hcl') }}

      - name: Terraform Init
        working-directory: terraform
        run: terraform init -migrate-state -reconfigure -input=false

      - name: Install kubectl
        uses: azure/setup-kubectl@v3

      - name: Update kubeconfig
        run: aws eks update-kubeconfig --region us-east-1 --name demo-dev-eks
        continue-on-error: true

      - name: Delete Kubernetes resources
        run: kubectl delete -f k8s/ --ignore-not-found=true
        continue-on-error: true

      - name: Remove Kubernetes resources from state
        working-directory: terraform
        continue-on-error: true
        run: |
          terraform state rm kubernetes_namespace.dev || true
          terraform state rm kubernetes_storage_class.gp3 || true
          terraform state rm kubernetes_role.dev_admin || true
          terraform state rm kubernetes_role.dev_readonly || true
          terraform state rm kubernetes_role_binding.dev_admin || true
          terraform state rm kubernetes_role_binding.dev_readonly || true
          terraform state rm kubernetes_service_account.dev_admin || true
          terraform state rm kubernetes_service_account.dev_readonly || true
          terraform state rm helm_release.metrics_server || true
          terraform state rm helm_release.prometheus || true
          terraform state rm helm_release.cluster_autoscaler || true
          terraform state rm helm_release.argocd || true

      - name: Terraform Destroy
        working-directory: terraform
        run: terraform destroy -auto-approve
