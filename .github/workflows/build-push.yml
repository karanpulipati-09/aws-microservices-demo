name: Build and Push to ECR

on:
  push:
    branches: [main]
    paths:
      - 'apps/**'
      - 'helm/**'

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  AWS_ACCOUNT_ID: 259851212818
  EKS_CLUSTER: demo-dev-eks

jobs:
  build-push:
    name: Build and Push
    runs-on: ubuntu-latest

    strategy:
      matrix:
        app: [frontend, api]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ env.AWS_ACCOUNT_ID }}:role/github-actions-terraform
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Get short SHA
        id: short-sha
        run: echo "SHA=$(echo ${{ github.sha }} | cut -c1-7)" >> $GITHUB_OUTPUT

      - name: Build Docker image
        run: |
          docker build \
            -t ${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/${{ matrix.app }}:${{ steps.short-sha.outputs.SHA }} \
            apps/${{ matrix.app }}

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/${{ matrix.app }}:${{ steps.short-sha.outputs.SHA }}
          format: table
          exit-code: 0
          severity: CRITICAL,HIGH

      - name: Push to ECR
        run: |
          docker push ${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/${{ matrix.app }}:${{ steps.short-sha.outputs.SHA }}

  deploy:
    name: Deploy to Dev
    runs-on: ubuntu-latest
    needs: build-push

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ env.AWS_ACCOUNT_ID }}:role/github-actions-terraform
          aws-region: ${{ env.AWS_REGION }}

      - name: Get short SHA
        id: short-sha
        run: echo "SHA=$(echo ${{ github.sha }} | cut -c1-7)" >> $GITHUB_OUTPUT

      - name: Connect to EKS
        run: aws eks update-kubeconfig --region ${{ env.AWS_REGION }} --name ${{ env.EKS_CLUSTER }}

      - name: Deploy frontend
        run: |
          helm upgrade --install frontend ./helm/frontend \
            --namespace dev \
            --set image.tag=${{ steps.short-sha.outputs.SHA }}

      - name: Deploy api
        run: |
          helm upgrade --install api ./helm/api \
            --namespace dev \
            --set image.tag=${{ steps.short-sha.outputs.SHA }}

      - name: Verify rollout
        run: |
          kubectl rollout status deployment/frontend-frontend -n dev --timeout=120s
          kubectl rollout status deployment/api-api -n dev --timeout=120s
