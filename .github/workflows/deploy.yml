name: CD — Deploy to Dev

on:
  # Triggered automatically after CI build succeeds (app code change)
  workflow_run:
    workflows: ["CI — Build and Push"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: write  # needed to push the values.yaml tag update back to Git

jobs:
  deploy:
    name: Update image tag in Git (ArgoCD will sync)
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Get image tag from CI build
        id: tag
        run: |
          echo "TAG=$(echo ${{ github.event.workflow_run.head_sha || github.sha }} | cut -c1-7)" >> $GITHUB_OUTPUT

      - name: Update image tag in values.yaml
        run: |
          TAG=${{ steps.tag.outputs.TAG }}
          sed -i "s/tag: .*/tag: \"$TAG\"/" helm/frontend/values.yaml
          sed -i "s/tag: .*/tag: \"$TAG\"/" helm/api/values.yaml
          echo "Updated image tag to $TAG"

      - name: Commit and push tag update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add helm/frontend/values.yaml helm/api/values.yaml
          git diff --staged --quiet || git commit -m "chore: update image tag to ${{ steps.tag.outputs.TAG }} [skip ci]"
          git push
