{{- if .Values.externalSecret.enabled }}
# Syncs the JSON secret in AWS Secrets Manager into a Kubernetes Secret.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "api.fullname" . }}-db
  namespace: {{ .Release.Namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: {{ include "api.fullname" . }}-aws
  target:
    name: {{ .Values.externalSecret.targetSecret }}
    creationPolicy: Owner
  data:
    {{- range $k := list "host" "port" "username" "password" "dbname" }}
    - secretKey: {{ $k }}
      remoteRef:
        key: {{ $.Values.externalSecret.remoteKey }}
        property: {{ $k }}
    {{- end }}
{{- end }}
