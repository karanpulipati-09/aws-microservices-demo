{{- if .Values.externalSecret.enabled }}
# Tells External Secrets Operator how to reach AWS Secrets Manager.
# No auth block: ESO's controller uses its own IRSA role (see Terraform).
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: {{ include "api.fullname" . }}-aws
  namespace: {{ .Release.Namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  provider:
    aws:
      service: SecretsManager
      region: {{ .Values.externalSecret.region }}
{{- end }}
