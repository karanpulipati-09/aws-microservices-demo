{{- if .Values.grafanaDashboard.enabled }}
# Picked up automatically by the Grafana sidecar in kube-prometheus-stack (label grafana_dashboard=1).
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "api.fullname" . }}-dashboard
  namespace: {{ .Release.Namespace }}
  labels:
    grafana_dashboard: "1"
    {{- include "api.labels" . | nindent 4 }}
data:
  api-dashboard.json: |-
    {{- .Files.Get "dashboards/api-dashboard.json" | nindent 4 }}
{{- end }}
