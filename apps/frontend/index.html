<!DOCTYPE html>
<html>
<head>
  <title>aws-microservices-demo</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 600px; margin: 80px auto; text-align: center; }
    h1 { color: #232f3e; }
    .badge { background: #ff9900; color: white; padding: 4px 12px; border-radius: 4px; font-size: 14px; }
    #api-response { margin-top: 20px; color: #555; }
  </style>
</head>
<body>
  <h1>aws-microservices-demo</h1>
  <span class="badge">Running on EKS</span>
  <div id="api-response">Calling API...</div>
  <script>
    fetch('http://a7aadda37251541c1b2b58b26a2dcc41-1702393043.us-east-1.elb.amazonaws.com:3000/health')
      .then(r => r.json())
      .then(d => document.getElementById('api-response').innerText = 'API: ' + d.status)
      .catch(() => document.getElementById('api-response').innerText = 'API unreachable');
  </script>
</body>
</html>
