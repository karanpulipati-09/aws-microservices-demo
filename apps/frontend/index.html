<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AWS Microservices Demo</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0f1117;
      color: #e2e8f0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .container {
      max-width: 700px;
      width: 100%;
      padding: 40px 24px;
    }

    .header {
      margin-bottom: 40px;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 12px;
    }

    .logo-icon {
      width: 40px;
      height: 40px;
      background: linear-gradient(135deg, #ff9900, #ffb84d);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
    }

    h1 {
      font-size: 28px;
      font-weight: 700;
      color: #f8fafc;
      letter-spacing: -0.5px;
    }

    .subtitle {
      color: #64748b;
      font-size: 14px;
      margin-top: 4px;
    }

    .cards {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      margin-bottom: 24px;
    }

    .card {
      background: #1e2130;
      border: 1px solid #2d3148;
      border-radius: 12px;
      padding: 20px;
    }

    .card-label {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #475569;
      margin-bottom: 8px;
    }

    .card-value {
      font-size: 18px;
      font-weight: 600;
      color: #f1f5f9;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      font-weight: 500;
      padding: 4px 10px;
      border-radius: 20px;
    }

    .badge-eks {
      background: #0d2e4d;
      color: #38bdf8;
      border: 1px solid #1e4976;
    }

    .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #38bdf8;
      animation: pulse 2s infinite;
    }

    .api-status {
      background: #1e2130;
      border: 1px solid #2d3148;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 24px;
    }

    .api-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .api-label {
      font-size: 14px;
      color: #94a3b8;
    }

    .api-value {
      font-size: 13px;
      font-weight: 500;
      padding: 4px 10px;
      border-radius: 6px;
    }

    .api-value.ok {
      background: #052e16;
      color: #4ade80;
      border: 1px solid #14532d;
    }

    .api-value.error {
      background: #2d0c0c;
      color: #f87171;
      border: 1px solid #5c1515;
    }

    .api-value.loading {
      background: #1c1a0f;
      color: #facc15;
      border: 1px solid #3d3510;
    }

    .api-detail {
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid #2d3148;
      font-size: 12px;
      color: #475569;
      font-family: 'Courier New', monospace;
      min-height: 18px;
    }

    .stack {
      background: #1e2130;
      border: 1px solid #2d3148;
      border-radius: 12px;
      padding: 20px;
    }

    .stack-title {
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #475569;
      margin-bottom: 14px;
    }

    .stack-items {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .tag {
      font-size: 12px;
      padding: 4px 10px;
      border-radius: 6px;
      background: #0f172a;
      border: 1px solid #2d3148;
      color: #94a3b8;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="logo">
        <div class="logo-icon">☁️</div>
        <div>
          <h1>AWS Microservices Demo</h1>
          <div class="subtitle">Portfolio project — Terraform + EKS + Helm</div>
        </div>
      </div>
    </div>

    <div class="cards">
      <div class="card">
        <div class="card-label">Platform</div>
        <div class="card-value">
          <span class="badge badge-eks"><span class="dot"></span>EKS 1.32</span>
        </div>
      </div>
      <div class="card">
        <div class="card-label">Namespace</div>
        <div class="card-value" id="env-value">dev</div>
      </div>
    </div>

    <div class="api-status">
      <div class="api-row">
        <span class="api-label">API Service</span>
        <span class="api-value loading" id="api-badge">checking...</span>
      </div>
      <div class="api-detail" id="api-detail"></div>
    </div>

    <div class="stack">
      <div class="stack-title">Stack</div>
      <div class="stack-items">
        <span class="tag">Terraform</span>
        <span class="tag">GitHub Actions</span>
        <span class="tag">Amazon EKS</span>
        <span class="tag">Amazon ECR</span>
        <span class="tag">Helm</span>
        <span class="tag">nginx</span>
        <span class="tag">Node.js</span>
        <span class="tag">PostgreSQL</span>
      </div>
    </div>
  </div>

  <script>
    const badge = document.getElementById('api-badge');
    const detail = document.getElementById('api-detail');
    const envValue = document.getElementById('env-value');

    fetch('/api/health')
      .then(r => r.json())
      .then(d => {
        badge.textContent = 'healthy';
        badge.className = 'api-value ok';
        detail.textContent = JSON.stringify(d);
        if (d.env) envValue.textContent = d.env;
      })
      .catch(() => {
        badge.textContent = 'unreachable';
        badge.className = 'api-value error';
        detail.textContent = 'GET /api/health — connection refused';
      });
  </script>
</body>
</html>
